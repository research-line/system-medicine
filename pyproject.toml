[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-medicine"
version = "0.7.2"
description = "A functional-pathway-centric medical knowledge graph for rare-disease differential-diagnosis research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lukas Geiger", email = "lukas@um-bruch.org"}
]
keywords = [
    "system-medicine",
    "knowledge-graph",
    "exclusion-logic",
    "pathway-analysis",
    "rare-disease",
    "differential-diagnosis",
    "pyside6",
    "sqlite"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]

[project.urls]
Homepage = "https://github.com/um-bruch/system-medicine"
Repository = "https://github.com/um-bruch/system-medicine.git"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.21311232"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = "."
